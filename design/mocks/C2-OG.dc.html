<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link preview — Pointer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#FFF6EA}
.theme-light{--paper:#FFF6EA;--gridline:#FFF6EA;--ink:#231F3A;--line:#231F3A;--shadow:#231F3A;--card:#FFFFFF;--card-2:#FFFBF4;--muted:#5A5570;--faint:#77728C;--pen:#A8440C;--on-accent:#231F3A;--inverse-bg:#231F3A;--inverse-fg:#FFF6EA;--yellow:#FFD45C;--mint:#6FD3AE;--orange:#FF8B42;--lilac:#B7A4F4;--peach:#FFC9A6;--sky:#9DD0FF;--tint-yellow:#FFF1C7;--tint-lilac:#EDE6FF;--tint-mint:#E3F7EF;--tint-cream:#FFF0DE;--hl:#FFE3A3;--past-bg:#F2EEE6;--past-line:#B3ADC2;--focus:#2F5BD8;--tape:transparent;--blob1:#B7A4F4;--blob2:#6FD3AE}
.theme-dark{--paper:#1A1728;--gridline:#1A1728;--ink:#FFF6EA;--line:#EFE6D6;--shadow:#08060F;--card:#272339;--card-2:#211D31;--muted:#CBC5DB;--faint:#9A94B0;--pen:#FFB27A;--on-accent:#231F3A;--inverse-bg:#FFF6EA;--inverse-fg:#1A1728;--yellow:#FFD45C;--mint:#6FD3AE;--orange:#FF9A57;--lilac:#B7A4F4;--peach:#F7BE9A;--sky:#94C8F5;--tint-yellow:#3A3122;--tint-lilac:#2E2748;--tint-mint:#1D3A33;--tint-cream:#2A2436;--hl:#4B3E1E;--past-bg:#201C30;--past-line:#5A5474;--focus:#9BB8FF;--tape:transparent;--blob1:#4A3F78;--blob2:#1F5A48}
a{color:var(--ink)}a:hover{color:var(--pen)}
button{font-family:'DM Sans',sans-serif;cursor:pointer}
.grid{background-color:var(--paper);background-image:linear-gradient(var(--gridline) 1px,transparent 1px),linear-gradient(90deg,var(--gridline) 1px,transparent 1px);background-size:28px 28px;transition:background-color .25s ease,color .25s ease}
.soft{font-family:Unbounded,sans-serif;letter-spacing:-0.03em}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:12px;z-index:50;padding:12px 18px;background:var(--inverse-bg);color:var(--inverse-fg);border-radius:10px;font-weight:700}
.skip:focus{left:24px}
@media (prefers-reduced-motion: reduce){.tilt{transform:none !important}.grid{transition:none}}
</style>
</helmet>
<div class="grid {{themeClass}}" style="position: relative; overflow: hidden; width: 1200px; height: 630px; box-sizing: border-box; padding: 64px 72px; display: flex; flex-direction: column; color: var(--ink)">

<div aria-hidden="true" style="position: absolute; top: -60px; right: -40px; width: 300px; height: 300px; border-radius: 50%; background: var(--blob1); opacity: 0.4"></div>
<div aria-hidden="true" style="position: absolute; bottom: -70px; left: 460px; width: 220px; height: 220px; border-radius: 48px; background: var(--blob2); opacity: 0.35; transform: rotate(18deg)"></div>
<div style="position: relative; display: flex; flex-direction: column; gap: 26px; width: 640px">
<span class="soft" style="font-size: 30px; font-weight: 800"><span aria-hidden="true" style="display: inline-flex; width: 40px; height: 40px; margin-right: 10px; vertical-align: middle; align-items: center; justify-content: center; border-radius: 10px; background: var(--orange); color: var(--on-accent); border: 2px solid var(--line); font-family: 'DM Sans', sans-serif; font-size: 20px; font-weight: 700">↑</span>pointer</span>
<span class="soft" style="font-size: 64px; font-weight: 800; line-height: 1">Algorithms you can <span style="background: var(--yellow); color: var(--on-accent); padding: 0 10px; border-radius: 12px">watch move.</span></span>
<span style="font-size: 24px; color: var(--muted)">15 interview patterns · animated explainers · free</span>
<span style="font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 500">pointer.rohanahire.com</span>
</div>
<div style="position: absolute; right: 70px; top: 170px; padding: 26px 22px; background: var(--card); border: 3px solid var(--line); border-radius: 28px; box-shadow: 8px 8px 0 var(--shadow); transform: rotate(3deg)">
<div style="position: relative; display: flex; gap: 8px">
<div style="position: absolute; left: 54px; top: -8px; width: 124px; height: 82px; box-sizing: border-box; border: 3px solid var(--line); border-radius: 18px; background: var(--tint-yellow)"></div>
<span style="position: relative; width: 52px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 14px; border: 2px dashed var(--past-line); color: var(--faint); font-family: 'DM Mono', monospace; font-size: 26px">a</span>
<span style="position: relative; width: 52px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--card); border: 2px solid var(--line); font-family: 'DM Mono', monospace; font-size: 26px">b</span>
<span style="position: relative; width: 52px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--card); border: 2px solid var(--line); font-family: 'DM Mono', monospace; font-size: 26px">c</span>
<span style="position: relative; width: 52px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--orange); color: var(--on-accent); border: 2px solid var(--line); font-family: 'DM Mono', monospace; font-size: 26px; transform: translateY(-10px) rotate(5deg)">a</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":630}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = Object.assign({ theme: 'light' }, {});
  }
  renderVals() {
    var self = this, st = this.state;
    var base = {
      themeClass: st.theme === 'dark' ? 'theme-dark' : 'theme-light',
      isDark: st.theme === 'dark', isLight: st.theme !== 'dark',
      themeLabel: st.theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme',
      toggleTheme: function () { self.setState({ theme: st.theme === 'dark' ? 'light' : 'dark' }); }
    };
    var extra = (function () {
    return {};
    })();
    return Object.assign(base, extra);
  }
}
</script>
</body>
</html>
