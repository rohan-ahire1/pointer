<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sliding Window, Try it — Pointer (Toybox phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#FFF6EA}
.theme-light{--paper:#FFF6EA;--gridline:#FFF6EA;--ink:#231F3A;--line:#231F3A;--shadow:#231F3A;--card:#FFFFFF;--card-2:#FFFBF4;--muted:#5A5570;--faint:#77728C;--pen:#A8440C;--on-accent:#231F3A;--inverse-bg:#231F3A;--inverse-fg:#FFF6EA;--yellow:#FFD45C;--mint:#6FD3AE;--orange:#FF8B42;--lilac:#B7A4F4;--peach:#FFC9A6;--sky:#9DD0FF;--tint-yellow:#FFF1C7;--tint-lilac:#EDE6FF;--tint-mint:#E3F7EF;--tint-cream:#FFF0DE;--hl:#FFE3A3;--past-bg:#F2EEE6;--past-line:#B3ADC2;--focus:#2F5BD8;--tape:transparent;--blob1:#B7A4F4;--blob2:#6FD3AE}
.theme-dark{--paper:#1A1728;--gridline:#1A1728;--ink:#FFF6EA;--line:#EFE6D6;--shadow:#08060F;--card:#272339;--card-2:#211D31;--muted:#CBC5DB;--faint:#9A94B0;--pen:#FFB27A;--on-accent:#231F3A;--inverse-bg:#FFF6EA;--inverse-fg:#1A1728;--yellow:#FFD45C;--mint:#6FD3AE;--orange:#FF9A57;--lilac:#B7A4F4;--peach:#F7BE9A;--sky:#94C8F5;--tint-yellow:#3A3122;--tint-lilac:#2E2748;--tint-mint:#1D3A33;--tint-cream:#2A2436;--hl:#4B3E1E;--past-bg:#201C30;--past-line:#5A5474;--focus:#9BB8FF;--tape:transparent;--blob1:#4A3F78;--blob2:#1F5A48}
a{color:var(--ink)}a:hover{color:var(--pen)}
button{font-family:'DM Sans',sans-serif;cursor:pointer}
.grid{background-color:var(--paper);background-image:linear-gradient(var(--gridline) 1px,transparent 1px),linear-gradient(90deg,var(--gridline) 1px,transparent 1px);background-size:24px 24px;transition:background-color .25s ease,color .25s ease}
.soft{font-family:Unbounded,sans-serif;letter-spacing:-0.03em}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:12px;z-index:50;padding:12px 18px;background:var(--inverse-bg);color:var(--inverse-fg);border-radius:10px;font-weight:700}
.skip:focus{left:24px}
@media (prefers-reduced-motion: reduce){.tilt{transform:none !important}.grid{transition:none}}
</style>
</helmet>
<div class="grid theme-light" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; color: var(--ink)">

<header style="position: absolute; left: 0; right: 0; top: 0; z-index: 3; background: var(--card); border-bottom: 2px solid var(--line); padding: 10px 12px 10px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px">
<a href="C2-Phone.dc.html" aria-label="Back to all patterns" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; border: 2px solid var(--line); border-radius: 12px; font-weight: 700">←</a>
<button type="button" style="flex-grow: 1; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: var(--yellow); border: 2px solid var(--line); border-radius: 12px; color: var(--on-accent); font-size: 15px; font-weight: 700"><span><span style="font-family: 'DM Mono', monospace; font-size: 13px">03</span> Sliding Window</span><span aria-hidden="true">▾</span><span class="sr-only">, switch pattern</span></button>
</div>
<nav aria-label="Lesson sections" style="display: flex; gap: 6px">
<a href="C2-PhoneLessonTop.dc.html" style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; text-decoration: none; border-radius: 10px; font-size: 14px; font-weight: 700">Idea</a>
<a href="C2-PhoneLessonTop.dc.html#watch" style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; text-decoration: none; border-radius: 10px; font-size: 14px; font-weight: 700">Watch</a>
<a href="#" aria-current="true" style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; text-decoration: none; border-radius: 10px; background: var(--inverse-bg); color: var(--inverse-fg); font-size: 14px; font-weight: 700">Try it</a>
<a href="C2-PhoneProblems.dc.html" style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; text-decoration: none; border-radius: 10px; font-size: 14px; font-weight: 700">Solve</a>
</nav>
</header>

<main style="position: absolute; left: 0; right: 0; top: 122px; bottom: 116px; overflow: hidden; padding: 18px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<h1 class="soft" style="margin: 0; font-size: 21px; font-weight: 800; line-height: 1.1">Now you drive</h1>
<div style="display: flex; gap: 6px; align-items: center">
<label for="p-input" class="sr-only">Input string</label>
<input id="p-input" value="{{s}}" onChange="{{onInput}}" maxlength="10" autocomplete="off" spellcheck="false" style="flex-grow: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--tint-yellow); font-family: 'DM Mono', monospace; font-size: 16px; font-weight: 700; color: var(--ink)">
<sc-for list="{{presets}}" as="pr" hint-placeholder-count="2">
<button type="button" onClick="{{pr.pick}}" aria-label="Load example {{pr.v}}" style="height: 44px; padding: 0 8px; background: var(--card); border: 2px solid var(--line); border-radius: 10px; font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 700; color: var(--ink)">{{pr.v}}</button>
</sc-for>
</div>
<div style="background: var(--card); border: 2px solid var(--line); border-radius: 20px; box-shadow: 4px 4px 0 var(--shadow); padding: 18px 12px 12px; display: flex; flex-direction: column; gap: 10px">
<div aria-hidden="true" style="position: relative; display: flex; gap: 4px; padding-top: 4px; min-height: 76px">
<sc-if value="{{showWin}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 0; height: 52px; left: {{winLeft}}px; width: {{winWidth}}px; box-sizing: border-box; border: 2px solid var(--line); border-radius: 12px; background: var(--tint-yellow)"></div>
</sc-if>
<sc-for list="{{cells}}" as="c" hint-placeholder-count="8">
<div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="width: 29px; height: 40px; box-sizing: border-box; margin-top: 2px; display: flex; align-items: center; justify-content: center; border-radius: 9px; font-family: 'DM Mono', monospace; font-size: 17px; font-weight: 700; background: {{c.bg}}; color: {{c.fg}}; border: 2px {{c.bs}} {{c.bd}}; transform: translateY({{c.lift}}px)">{{c.ch}}</div>
<div style="height: 20px; display: flex; gap: 1px; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 700">
<sc-if value="{{c.isL}}" hint-placeholder-val="{{ false }}"><span style="padding: 1px 4px; background: var(--inverse-bg); color: var(--inverse-fg); border-radius: 5px">L</span></sc-if>
<sc-if value="{{c.isR}}" hint-placeholder-val="{{ false }}"><span style="padding: 0 4px; background: var(--orange); border: 1.5px solid var(--line); border-radius: 5px; color: var(--on-accent)">R</span></sc-if>
</div>
</div>
</sc-for>
</div>
<div aria-live="{{liveMode}}" aria-atomic="true" style="padding: 10px 12px; background: var(--tint-cream); border: 2px solid var(--line); border-radius: 12px 12px 12px 3px; font-size: 16px; font-weight: 700; line-height: 1.35; min-height: 44px; box-sizing: border-box">{{note}}<span class="sr-only"> {{srSummary}}</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; font-family: 'DM Mono', monospace">
<div style="padding: 8px; border: 2px solid var(--line); border-radius: 10px; background: var(--tint-lilac)"><div style="font-size: 11px; font-weight: 700">window</div><div style="font-size: 14px; font-weight: 700">"{{win}}"</div></div>
<div style="padding: 8px; border: 2px solid var(--line); border-radius: 10px; background: var(--tint-mint)"><div style="font-size: 11px; font-weight: 700">seen</div><div style="font-size: 14px; font-weight: 700">{{seenText}}</div></div>
<div style="padding: 8px; border: 2px solid var(--line); border-radius: 10px; background: var(--yellow); color: var(--on-accent)"><div style="font-size: 11px; font-weight: 700">best</div><div style="font-size: 14px; font-weight: 700">{{best}}</div></div>
</div>
</div>
<details style="background: var(--card-2); border: 2px solid var(--line); border-radius: 14px; padding: 0 14px">
<summary style="min-height: 44px; display: flex; align-items: center; font-weight: 700; font-size: 15px; cursor: pointer">Show the code · line {{lineLabel}}</summary>
<div style="padding-bottom: 12px; font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 700; white-space: pre; overflow-x: auto">{{activeCode}}</div>
</details>
</main>

<div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--card); border-top: 2px solid var(--line); padding: 10px 12px 26px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted)"><span>{{stepLabel}}</span><span>Lesson 3 of 15</span></div>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{reset}}" aria-label="Reset to the first step" style="width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--card); border: 2px solid var(--line); border-radius: 12px; color: var(--ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg></button>
<button type="button" onClick="{{prev}}" style="flex: 1; height: 48px; background: var(--card); border: 2px solid var(--line); border-radius: 12px; font-size: 15px; font-weight: 700; color: var(--ink)">← Back</button>
<button type="button" onClick="{{toggle}}" style="flex: 1; height: 48px; background: var(--orange); border: 2px solid var(--line); border-radius: 12px; font-size: 15px; font-weight: 700; color: var(--on-accent)">{{playLabel}}</button>
<button type="button" onClick="{{next}}" style="flex: 1; height: 48px; background: var(--mint); border: 2px solid var(--line); border-radius: 12px; font-size: 15px; font-weight: 700; color: var(--on-accent)">Step →</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.CODE = ['function longest(s: string): number {', '  const seen = new Set<string>();', '  let left = 0, best = 0;', '', '  for (let r = 0; r < s.length; r++) {', '    while (seen.has(s[r])) {', '      seen.delete(s[left]);', '      left++;', '    }', '    seen.add(s[r]);', '    best = Math.max(best, r - left + 1);', '  }', '  return best;', '}'];
    this.steps = this.build('abcabcbb');
    this.state = { s: 'abcabcbb', i: 0, playing: false };
  }
  build(s) {
    var out = [], l = 0, best = 0, seen = [], q = function (c) { return '‘' + c + '’'; };
    out.push({ l: 0, r: -1, incl: false, seen: [], best: 0, lines: [1, 2], note: 'Start with an empty window.' });
    for (var r = 0; r < s.length; r++) {
      out.push({ l: l, r: r, incl: false, seen: seen.slice(), best: best, lines: [4, 5], note: 'Right edge reaches ' + q(s[r]) + '. Already inside?' });
      while (seen.indexOf(s[r]) >= 0) {
        var ch = s[l];
        seen.splice(seen.indexOf(ch), 1);
        l++;
        out.push({ l: l, r: r, incl: false, seen: seen.slice(), best: best, lines: [6, 7], note: 'Repeat. Move the left edge past ' + q(ch) + '.' });
      }
      seen.push(s[r]);
      best = Math.max(best, r - l + 1);
      out.push({ l: l, r: r, incl: true, seen: seen.slice(), best: best, lines: [9, 10], note: 'Add ' + q(s[r]) + '. Window “' + s.slice(l, r + 1) + '”, length ' + (r - l + 1) + '.' });
    }
    out.push({ l: l, r: s.length - 1, incl: true, seen: seen.slice(), best: best, lines: [12], note: 'Done. Longest is ' + best + '.' });
    return out;
  }
  load(v) { clearInterval(this.t); this.steps = this.build(v); this.setState({ s: v, i: 0, playing: false }); }
  go(d) { this.setState({ i: Math.max(0, Math.min(this.steps.length - 1, this.state.i + d)) }); }
  toggle() {
    var self = this;
    if (this.state.playing) { clearInterval(this.t); this.setState({ playing: false }); return; }
    if (this.state.i >= this.steps.length - 1) this.setState({ i: 0 });
    this.setState({ playing: true });
    this.t = setInterval(function () {
      if (self.state.i >= self.steps.length - 1) { clearInterval(self.t); self.setState({ playing: false }); } else self.go(1);
    }, 900);
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    var self = this, st = this.steps[Math.min(this.state.i, this.steps.length - 1)], s = this.state.s, CW = 33, code = this.CODE;
    var cells = s.split('').map(function (ch, idx) {
      var inc = idx === st.r && !st.incl, past = idx < st.l && st.r >= 0;
      return { ch: ch, isL: st.r >= 0 && idx === st.l, isR: idx === st.r, bg: inc ? 'var(--orange)' : (past ? 'var(--past-bg)' : 'var(--card)'), fg: inc ? 'var(--on-accent)' : (past ? 'var(--faint)' : 'var(--ink)'), bd: past ? 'var(--past-line)' : 'var(--ink)', bs: past ? 'dashed' : 'solid', lift: inc ? -5 : 0 };
    });
    var endW = st.incl ? st.r + 1 : st.r, wlen = st.r >= 0 ? Math.max(0, endW - st.l) : 0;
    var winStr = st.r >= 0 ? s.slice(st.l, Math.max(st.l, endW)) : '';
    var sum = 'Step ' + (this.state.i + 1) + ' of ' + this.steps.length + '.' + (st.r >= 0 ? ' Window "' + winStr + '", best ' + st.best + '.' : '');
    return {
      s: s, cells: cells, note: st.note, best: st.best, win: winStr, seenText: '{' + st.seen.join(',') + '}',
      showWin: wlen > 0, winLeft: st.l * CW - 3, winWidth: wlen * CW + 2,
      srSummary: sum, liveMode: this.state.playing ? 'off' : 'polite',
      lineLabel: st.lines.map(function (k) { return k + 1; }).join('–'),
      activeCode: st.lines.map(function (k) { return '▶ ' + code[k].replace(/^\s+/, ''); }).join('\n'),
      stepLabel: 'Step ' + (this.state.i + 1) + ' of ' + this.steps.length,
      playLabel: this.state.playing ? 'Pause' : 'Play ▶',
      onInput: function (e) { self.load(String(e.target.value || '').toLowerCase().replace(/[^a-z]/g, '').slice(0, 10)); },
      presets: ['bbbbb', 'pwwkew'].map(function (v) { return { v: v, pick: function () { self.load(v); } }; }),
      next: function () { self.go(1); }, prev: function () { self.go(-1); },
      reset: function () { clearInterval(self.t); self.setState({ i: 0, playing: false }); },
      toggle: function () { self.toggle(); }
    };
  }
}
</script>
</body>
</html>
